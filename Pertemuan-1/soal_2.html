<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Mahasiswa</title>
</head>
<body>

    <h1>Form Pendaftaran Mahasiswa</h1>

    <form>

        <p>
            <label for="nama">Nama:</label>
            <br>
            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama"
            >
        </p>

        <p>
            <label for="email">Email:</label>
            <br>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Masukkan email"
            >
        </p>

        <p>
            <label for="password">Password:</label>
            <br>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password"
            >
        </p>

        <p>
            <label>Jenis Kelamin:</label>
            <br>

            <input
                type="radio"
                id="laki-laki"
                name="jenis_kelamin"
                value="Laki-laki"
            >
            <label for="laki-laki">Laki-laki</label>

            <br>

            <input
                type="radio"
                id="perempuan"
                name="jenis_kelamin"
                value="Perempuan"
            >
            <label for="perempuan">Perempuan</label>
        </p>

        <p>
            <label>Hobi:</label>
            <br>

            <input
                type="checkbox"
                id="coding"
                name="hobi"
                value="Coding"
            >
            <label for="coding">Coding</label>

            <br>

            <input
                type="checkbox"
                id="musik"
                name="hobi"
                value="Musik"
            >
            <label for="musik">Musik</label>

            <br>

            <input
                type="checkbox"
                id="olahraga"
                name="hobi"
                value="Olahraga"
            >
            <label for="olahraga">Olahraga</label>
        </p>

        <p>
            <label for="pendidikan">Pendidikan:</label>
            <br>

            <select id="pendidikan" name="pendidikan">

                <option value="">
                    -- Pilih Pendidikan --
                </option>

                <option value="SMA">
                    SMA
                </option>

                <option value="SMK">
                    SMK
                </option>

                <option value="D3">
                    D3
                </option>

                <option value="S1">
                    S1
                </option>

            </select>
        </p>

        <p>
            <label for="kritik-saran">
                Kritik dan Saran:
            </label>
            <br>

            <textarea
                id="kritik-saran"
                name="kritik_saran"
                rows="5"
                cols="40"
                placeholder="Tuliskan kritik dan saran..."
            ></textarea>
        </p>

        <p>
            <button type="submit">
                Submit
            </button>
        </p>

    </form>

</body>
</html>
